# helm-values/discovery-server.yaml
# Discovery Server (Eureka) — waits for Config Server only

image:
  repository: "<account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-<env>/discovery-server"
  tag: "d8969d4"
service:
  port: 8761
component: server
configMap:
  SPRING_PROFILES_ACTIVE: "docker"
  CONFIG_SERVER_URL: "http://config-server:8888"
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo "waiting for config-server"; sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
# Prod: 2 replicas, PDB enabled, no HPA
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: true
  minAvailable: 1
