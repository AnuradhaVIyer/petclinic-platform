# helm-values/admin-server.yaml
# Admin Server — Spring Boot Admin dashboard, no DB, no secrets

image:
  tag: "ecba47b"
registry:
  serviceName: "admin-server"
  
service:
  port: 9090
component: admin
configMap:
  SPRING_PROFILES_ACTIVE: "docker"
  CONFIG_SERVER_URL: "http://config-server:8888"
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo "waiting for config-server"; sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do echo "waiting for discovery-server"; sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
# Prod: 1 replica, no HPA, no PDB (monitoring tool, single replica sufficient)
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
