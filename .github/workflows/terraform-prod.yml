name: "Terraform — Prod Infrastructure"

# Triggers:
#   - PR targeting main that touches prod Terraform files → plan only
#   - Manual dispatch → choose plan or apply (apply requires manual approval gate)
#
# PROD SAFETY: Apply NEVER runs automatically. It requires:
#   1. workflow_dispatch with action=apply
#   2. Approval from a reviewer configured in the "prod" GitHub Environment

on:
  pull_request:
    branches:
      - main
    paths:
      - terraform/environments/prod/**
      - terraform/modules/**
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action (apply requires Environment approval)
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: 1.11.0
  AWS_REGION: ${{ secrets.AWS_REGION }}
  WORKING_DIR: terraform/environments/prod

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Plan — always runs on PR and manual dispatch with action=plan
  # ---------------------------------------------------------------------------
  plan:
    name: Terraform Prod — Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-prod-plan

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            terraform fmt -check -recursive
          else
            terraform fmt -recursive
          fi
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Refresh
        id: refresh
        run: |
          terraform refresh \
            -input=false \
            -var="domain_name=anveantechnologies.com"
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -lock-timeout=5m \
            -var="domain_name=anveantechnologies.com" \
            -out=plan.out \
            2>&1 | tee plan.txt
          TF_EXIT=${PIPESTATUS[0]}
          echo "exitcode=${TF_EXIT}" >> $GITHUB_OUTPUT
          exit ${TF_EXIT}

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            ${{ env.WORKING_DIR }}/plan.out
            ${{ env.WORKING_DIR }}/plan.txt
          retention-days: 5

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... truncated ...'
              : plan;

            const statusIcon = (outcome) => {
              if (outcome === 'success') return '✅';
              if (outcome === 'failure') return '❌';
              if (outcome === 'skipped') return '⏭️';
              return '⚠️';
            };

            const exitcode = '${{ steps.plan.outputs.exitcode }}';
            const planSummary = exitcode === '2'
              ? '🟡 **Changes detected** — review the plan below before applying.'
              : exitcode === '0'
              ? '🟢 **No changes** — infrastructure is up to date.'
              : '🔴 **Plan failed** — check the output below for errors.';

            const output = `## Terraform Plan — Prod 🔒

            > ⚠️ **Production infrastructure.** Apply requires manual approval.

            ${planSummary}

            ---

            ### 🔧 Pipeline Status

            | Step | Status | Result |
            |------|--------|--------|
            | 🎨 Format   | ${statusIcon('${{ steps.fmt.outcome }}')}   | \`${{ steps.fmt.outcome }}\` |
            | 🚀 Init     | ${statusIcon('${{ steps.init.outcome }}')}   | \`${{ steps.init.outcome }}\` |
            | ✅ Validate | ${statusIcon('${{ steps.validate.outcome }}')} | \`${{ steps.validate.outcome }}\` |
            | 🔄 Refresh  | ${statusIcon('${{ steps.refresh.outcome }}')} | \`${{ steps.refresh.outcome }}\` |
            | 📋 Plan     | ${statusIcon('${{ steps.plan.outcome }}')}   | \`${{ steps.plan.outcome }}\` |

            ---

            ### 📦 Terraform Variables

            | Variable | Value |
            |----------|-------|
            | \`domain_name\` | \`anveantechnologies.com\` |
            | \`aws_region\`  | \`${{ env.AWS_REGION }}\` |
            | \`tf_version\`  | \`${{ env.TF_VERSION }}\` |

            ---

            ### 📄 Plan Output

            <details><summary>🔍 Click to expand plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            ---

            > 💡 *To apply: trigger workflow manually with \`action=apply\` after approval.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Release state lock on cancellation
        if: cancelled()
        run: >-
          terraform force-unlock -force $(cat plan.txt | grep -oP
          'ID:\s+\K[\w-]+' | head -1 || echo "") 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Job 2: Apply — manual dispatch only, gated by GitHub Environment approval
  # Runs its own fresh plan so it is never dependent on a stale exitcode
  # from Job 1 (e.g. when infra was destroyed between the two runs).
  # ---------------------------------------------------------------------------
  apply:
    name: Terraform Prod — Apply (Approval Required)
    runs-on: ubuntu-latest
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'apply'
    environment: prod
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      # Checkout MUST be first — working-directory does not exist before this
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-prod-apply

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Refresh
        run: |
          terraform refresh \
            -input=false \
            -var="domain_name=anveantechnologies.com"
        continue-on-error: true

      # Fresh plan in the apply job — avoids stale exitcode from the plan job
      # which may have run on a different state (e.g. infra destroyed in between)
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -lock-timeout=5m \
            -var="domain_name=anveantechnologies.com" \
            -out=plan.out \
            2>&1 | tee plan.txt
          TF_EXIT=${PIPESTATUS[0]}
          echo "exitcode=${TF_EXIT}" >> $GITHUB_OUTPUT
          exit ${TF_EXIT}

      - name: Check for infrastructure changes
        run: |
          EXIT="${{ steps.plan.outputs.exitcode }}"
          if [ "$EXIT" == "1" ]; then
            echo "❌ Terraform plan failed. Check the plan output above."
            exit 1
          fi
          if [ "$EXIT" != "2" ]; then
            echo "🟢 No infrastructure changes detected. Nothing to apply."
            exit 1
          fi
          echo "🟡 Changes detected. Proceeding with apply after approval."

      # The environment approval gate pauses here until a required reviewer
      # approves in the GitHub UI before apply runs.
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve plan.out

      - name: Post Apply Summary
        if: always()
        run: |
          echo "## Terraform Apply — Prod 🔒" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`domain_name\` | \`anveantechnologies.com\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`aws_region\`  | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`tf_version\`  | \`${{ env.TF_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.plan.outputs.exitcode }}" == "2" ]; then
            echo "✅ **Apply completed successfully.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Apply did not run — no changes were detected or plan failed.**" >> $GITHUB_STEP_SUMMARY
          fi