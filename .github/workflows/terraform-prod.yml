name: "Terraform — Prod Infrastructure"

# Triggers:
#   - PR targeting main that touches prod Terraform files → plan only
#   - Manual dispatch → choose plan or apply (apply requires manual approval gate)
#
# PROD SAFETY: Apply NEVER runs automatically. It requires:
#   1. workflow_dispatch with action=plan  → generates and uploads plan artifact
#   2. workflow_dispatch with action=apply → downloads artifact, approval gate, applies

on:
  pull_request:
    branches:
      - main
    paths:
      - terraform/environments/prod/**
      - terraform/modules/**
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action (run plan first, then apply)
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: read

env:
  TF_VERSION: 1.11.0
  AWS_REGION: ${{ secrets.AWS_REGION }}
  WORKING_DIR: terraform/environments/prod

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Plan
  #   - Runs on PR automatically
  #   - Runs when action=plan on manual dispatch
  #   - Skipped entirely when action=apply
  # ---------------------------------------------------------------------------
  plan:
    name: Terraform Prod — Plan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-prod-plan

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            terraform fmt -check -recursive
          else
            terraform fmt -recursive
          fi
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # NOTE: No terraform refresh here — terraform plan already refreshes
      # state internally by default. An explicit refresh was causing silent
      # failures that made plan return exitcode 0 incorrectly.
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -lock-timeout=5m \
            -out=plan.out \
            2>&1 | tee plan.txt
          TF_EXIT=${PIPESTATUS[0]}
          echo "exitcode=${TF_EXIT}" >> $GITHUB_OUTPUT
          exit ${TF_EXIT}

      # Only upload when there are actual changes (exitcode=2)
      # apply job will fail clearly at download step if no artifact exists
      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            ${{ env.WORKING_DIR }}/plan.out
            ${{ env.WORKING_DIR }}/plan.txt
          retention-days: 5

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... truncated ...'
              : plan;

            const statusIcon = (outcome) => {
              if (outcome === 'success') return '✅';
              if (outcome === 'failure') return '❌';
              if (outcome === 'skipped') return '⏭️';
              return '⚠️';
            };

            const exitcode = '${{ steps.plan.outputs.exitcode }}';
            const planSummary = exitcode === '2'
              ? '🟡 **Changes detected** — review the plan below before applying.'
              : exitcode === '0'
              ? '🟢 **No changes** — infrastructure is up to date.'
              : '🔴 **Plan failed** — check the output below for errors.';

            const output = `## Terraform Plan — Prod 🔒

            > ⚠️ **Production infrastructure.** Apply requires manual approval.

            ${planSummary}

            ---

            ### 🔧 Pipeline Status

            | Step | Status | Result |
            |------|--------|--------|
            | 🎨 Format   | ${statusIcon('${{ steps.fmt.outcome }}')}   | \`${{ steps.fmt.outcome }}\` |
            | 🚀 Init     | ${statusIcon('${{ steps.init.outcome }}')}   | \`${{ steps.init.outcome }}\` |
            | ✅ Validate | ${statusIcon('${{ steps.validate.outcome }}')} | \`${{ steps.validate.outcome }}\` |
            | 📋 Plan     | ${statusIcon('${{ steps.plan.outcome }}')}   | \`${{ steps.plan.outcome }}\` |

            ---

            ### 📦 Terraform Variables

            | Variable | Value |
            |----------|-------|
            | \`aws_region\`  | \`${{ env.AWS_REGION }}\` |
            | \`tf_version\`  | \`${{ env.TF_VERSION }}\` |

            ---

            ### 📄 Plan Output

            <details><summary>🔍 Click to expand plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            ---

            > 💡 *To apply: trigger this workflow manually with \`action=apply\` after approval.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Write plan summary
        if: always()
        run: |
          EXIT="${{ steps.plan.outputs.exitcode }}"
          echo "## Terraform Plan — Prod 🔒" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Terraform Variables" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`aws_region\`  | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`tf_version\`  | \`${{ env.TF_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$EXIT" == "2" ]; then
            echo "🟡 **Changes detected** — run with \`action=apply\` to proceed." >> $GITHUB_STEP_SUMMARY
          elif [ "$EXIT" == "0" ]; then
            echo "🟢 **No changes detected** — infrastructure is up to date." >> $GITHUB_STEP_SUMMARY
          else
            echo "🔴 **Plan failed** — review the logs above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Release state lock on cancellation
        if: cancelled()
        run: >-
          terraform force-unlock -force $(cat plan.txt | grep -oP
          'ID:\s+\K[\w-]+' | head -1 || echo "") 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Job 2: Apply
  #   - Only runs when action=apply on manual dispatch
  #   - Downloads artifact from the most recent successful plan run
  #     using dawidd6/action-download-artifact which can cross workflow runs
  #   - Approval popup fires when this job is queued (before any steps run)
  # ---------------------------------------------------------------------------
  apply:
    name: Terraform Prod — Apply (Approval Required)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'apply'
    environment: prod
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      # Checkout first — working-directory does not exist before this
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-prod-apply

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      # dawidd6/action-download-artifact can find artifacts across workflow
      # runs — actions/download-artifact@v4 only looks within the current run
      # and would always fail here since plan ran in a different run.
      - name: Download plan artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: terraform-prod.yml
          name: tfplan-prod
          path: ${{ env.WORKING_DIR }}
          if_no_artifact_found: fail
          # Downloads from the most recent successful run that has the artifact.
          # Change to run_id: <id> to pin to a specific plan run.

      - name: Show saved plan before applying
        run: |
          echo "## Terraform Apply — Prod 🔒" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Terraform Variables" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`aws_region\`  | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`tf_version\`  | \`${{ env.TF_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Plan Being Applied" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`hcl" >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve plan.out

      - name: Post apply result
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Apply completed successfully.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Apply failed** — review the logs above." >> $GITHUB_STEP_SUMMARY
          fi