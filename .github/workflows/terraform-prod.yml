name: "Terraform — Prod Infrastructure"

# Triggers:
#   - Push to main that touches prod Terraform files → plan only (NO auto-apply)
#   - PR targeting main that touches prod Terraform files → plan only
#   - Manual dispatch → choose plan or apply (apply requires manual approval gate)
#
# PROD SAFETY: Apply NEVER runs automatically. It requires:
#   1. workflow_dispatch with action=apply
#   2. Approval from a reviewer configured in the "prod" GitHub Environment
on:
  push:
    branches: [main]
    paths:
      - "terraform/environments/prod/**"
      - "terraform/modules/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/environments/prod/**"
      - "terraform/modules/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action (apply requires Environment approval)"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.11.0"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  WORKING_DIR: terraform/environments/prod

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Plan — always runs, no approval needed
  # ---------------------------------------------------------------------------
  plan:
    name: "Terraform Prod — Plan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-prod-plan

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Format — check on PRs, auto-fix on push/dispatch
      - name: Terraform Format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            terraform fmt -check -recursive
          else
            terraform fmt -recursive
          fi
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -lock-timeout=5m \
            -var="domain_name=anveantechnologies.com" \
            -out=plan.out \
            2>&1 | tee plan.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT
        # Exit codes: 0=no changes, 1=error, 2=changes present

      # Upload plan artifact so the apply job can use it without re-running plan
      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            ${{ env.WORKING_DIR }}/plan.out
            ${{ env.WORKING_DIR }}/plan.txt
          retention-days: 5

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... truncated ...'
              : plan;
            const output = `## Terraform Plan — Prod 🔒

            > ⚠️ **Production infrastructure.** Apply requires manual approval.

            | Step | Result |
            |------|--------|
            | Format   | \`${{ steps.fmt.outcome }}\` |
            | Init     | \`${{ steps.init.outcome }}\` |
            | Validate | \`${{ steps.validate.outcome }}\` |
            | Plan     | \`${{ steps.plan.outcome }}\` |

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *To apply: trigger the workflow manually with \`action=apply\` after approval.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # Release stale lock if workflow is cancelled during plan
      - name: Release state lock on cancellation
        if: cancelled()
        run: terraform force-unlock -force $(cat plan.txt | grep -oP 'ID:\s+\K[\w-]+' | head -1 || echo "") 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Job 2: Apply — manual dispatch only, gated by GitHub Environment approval
  # ---------------------------------------------------------------------------
  apply:
    name: "Terraform Prod — Apply (Approval Required)"
    runs-on: ubuntu-latest
    needs: plan
    # Only runs on manual dispatch with action=apply AND plan found changes
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'apply' &&
      needs.plan.outputs.plan_exitcode == '2'

    # "prod" GitHub Environment must have required reviewers configured.
    # The workflow pauses here until an approver clicks "Approve and deploy".
    environment: prod

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-prod-apply

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      # Download the saved plan from the plan job — do NOT re-plan
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=5m plan.out

      # Release stale lock if workflow is cancelled during apply
      - name: Release state lock on cancellation
        if: cancelled()
        run: terraform force-unlock -force $(cat plan.txt | grep -oP 'ID:\s+\K[\w-]+' | head -1 || echo "") 2>/dev/null || true