name: Trivy Scan

on:
  workflow_call:
    inputs:
      image-ref:
        required: true
        type: string

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL
