name: Update Image Tags

on:
  repository_dispatch:
    types:
      - app-image-built

permissions:
  contents: write

jobs:
  update-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags and repository URLs
        env:
          IMAGE_TAG: ${{ github.event.client_payload.sha }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: dev
        run: |
          services=(
            config-server
            discovery-server
            api-gateway
            customers-service
            visits-service
            vets-service
            admin-server
            genai-service
          )

          for service in "${services[@]}"; do
            file="helm-values/${service}.yaml"
            echo "Updating ${file}"

            # Update image tag
            yq -i '.image.tag = strenv(IMAGE_TAG)' "${file}"

            # Inject repository URL — no hardcoding in yaml files
            REPO="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/petclinic-${ENVIRONMENT}/${service}"
            yq -i ".image.repository = \"${REPO}\"" "${file}"

            echo "  tag=${IMAGE_TAG}"
            echo "  repository=${REPO}"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-values/
          git commit -m "ci: update image tags to ${{ github.event.client_payload.sha }}" || echo "No changes"

      - name: Push changes
        run: git push