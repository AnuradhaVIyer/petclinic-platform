name: Update Image Tags

on:
  repository_dispatch:
    types:
      - app-image-built

permissions:
  contents: write

jobs:
  update-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ github.event.client_payload.sha }}
        run: |
          services=(
            config-server
            discovery-server
            api-gateway
            customers-service
            visits-service
            vets-service
            admin-server
            genai-service
          )

          for service in "${services[@]}"; do
            file="helm-values/${service}.yaml"
            echo "Updating ${file}"
            yq -i '.image.tag = strenv(IMAGE_TAG)' "${file}"
            echo "  tag=${IMAGE_TAG}"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-values/
          git commit -m "ci: update image tags to ${{ github.event.client_payload.sha }}" || echo "No changes"

      - name: Push changes
        run: git push