name: "Bootstrap — Install ArgoCD"

# One-time workflow to install ArgoCD on the EKS cluster and apply
# ArgoCD Applications to the cluster.
#
# Run AFTER Terraform successfully creates:
# - EKS cluster
# - node groups
# - networking
#
# After bootstrap:
# - ArgoCD becomes the deployment controller
# - Git becomes the source of truth
# - Future deployments happen automatically through GitOps
#
# Location:
#   .github/workflows/bootstrap-argocd.yml
#
# Trigger:
#   GitHub Actions → Bootstrap — Install ArgoCD → Run workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  CLUSTER_NAME: petclinic-${{ github.event.inputs.environment }}

jobs:
  bootstrap-argocd:
    name: "Bootstrap ArgoCD — ${{ github.event.inputs.environment }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-argocd-bootstrap

      # -----------------------------------------------------------------------
      # Install kubectl
      # -----------------------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # -----------------------------------------------------------------------
      # Configure kubeconfig for EKS
      # -----------------------------------------------------------------------
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      # -----------------------------------------------------------------------
      # Verify cluster access
      # -----------------------------------------------------------------------
      - name: Verify cluster access
        run: |
          kubectl get nodes

      # -----------------------------------------------------------------------
      # Create argocd namespace safely
      # -----------------------------------------------------------------------
      - name: Create argocd namespace
        run: |
          kubectl create namespace argocd \
            --dry-run=client -o yaml | kubectl apply -f -

      # -----------------------------------------------------------------------
      # Install ArgoCD using server-side apply
      #
      # Why server-side apply?
      # - avoids CRD annotation size limit errors
      # - safe for reruns
      # - safe for upgrades
      # - avoids AlreadyExists failures
      # -----------------------------------------------------------------------
      - name: Install ArgoCD
        run: |
          kubectl apply --server-side -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

      # -----------------------------------------------------------------------
      # Wait for ArgoCD server deployment
      # -----------------------------------------------------------------------
      - name: Wait for ArgoCD server
        run: |
          kubectl rollout status deployment/argocd-server \
            -n argocd \
            --timeout=300s

      # -----------------------------------------------------------------------
      # Install External Secrets Operator
      # -----------------------------------------------------------------------
      - name: Install External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.EXTERNAL_SECRETS_ROLE_ARN }} \
            --wait

      # -----------------------------------------------------------------------
      # Apply ClusterSecretStore
      # -----------------------------------------------------------------------
      - name: Apply ClusterSecretStore
        run: |
          kubectl apply -f k8s/argocd/install/cluster-secret-store.yaml
                
      # -----------------------------------------------------------------------
      # Apply ArgoCD RBAC configuration
      # -----------------------------------------------------------------------
      - name: Apply ArgoCD RBAC
        run: |
          kubectl apply -f k8s/argocd/argocd-rbac-cm.yaml

      # -----------------------------------------------------------------------
      # Apply Kubernetes namespaces
      # -----------------------------------------------------------------------
      - name: Apply Kubernetes namespaces
        run: |
          kubectl apply -f k8s/base/namespaces.yaml

      # -----------------------------------------------------------------------
      # Apply ArgoCD Applications for selected environment
      # -----------------------------------------------------------------------
      - name: Apply ArgoCD Applications
        run: |
          kubectl apply \
            -f k8s/argocd/applications/${{ github.event.inputs.environment }}/

      # -----------------------------------------------------------------------
      # Expose ArgoCD UI using AWS LoadBalancer
      #
      # Avoids unstable CI port-forwarding.
      # -----------------------------------------------------------------------
      - name: Expose ArgoCD server
        run: |
          kubectl patch svc argocd-server \
            -n argocd \
            -p '{"spec":{"type":"LoadBalancer"}}'

      # -----------------------------------------------------------------------
      # Wait for external LoadBalancer hostname
      # -----------------------------------------------------------------------
      - name: Wait for ArgoCD LoadBalancer
        run: |
          echo "Waiting for ArgoCD LoadBalancer..."

          for i in {1..30}; do
            HOSTNAME=$(kubectl get svc argocd-server -n argocd \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$HOSTNAME" ]; then
              echo ""
              echo "ArgoCD URL:"
              echo "https://$HOSTNAME"
              echo ""
              break
            fi

            sleep 10
          done

      # -----------------------------------------------------------------------
      # Print initial admin password
      # -----------------------------------------------------------------------
      - name: Print ArgoCD admin password
        run: |
          echo "ArgoCD admin password:"
          kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d

          echo ""
          echo ""

      # -----------------------------------------------------------------------
      # Verify ArgoCD Applications
      # -----------------------------------------------------------------------
      - name: Verify ArgoCD Applications
        run: |
          kubectl get applications -n argocd

      # -----------------------------------------------------------------------
      # Verify ArgoCD Pods
      # -----------------------------------------------------------------------
      - name: Verify ArgoCD Pods
        run: |
          kubectl get pods -n argocd