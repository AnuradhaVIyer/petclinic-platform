apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # Default policy for authenticated users not matched by any role below
  policy.default: role:readonly

  policy.csv: |
    # -------------------------------------------------------------------------
    # role:admin — full access to all applications and ArgoCD settings
    # Assigned to: ops team members
    # -------------------------------------------------------------------------
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters,     *, *,   allow
    p, role:admin, repositories, *, *,   allow
    p, role:admin, projects,     *, *,   allow
    p, role:admin, accounts,     *, *,   allow
    p, role:admin, gpgkeys,      *, *,   allow
    p, role:admin, logs,         get, */*, allow
    p, role:admin, exec,         create, */*, allow

    # -------------------------------------------------------------------------
    # role:developer — view all apps, sync dev only, no prod sync
    # -------------------------------------------------------------------------
    # View all applications in both environments
    p, role:developer, applications, get,    */*, allow

    # Sync, refresh, and override dev applications only
    p, role:developer, applications, sync,     */petclinic-dev/*, allow
    p, role:developer, applications, action/*,  */petclinic-dev/*, allow
    p, role:developer, applications, override,  */petclinic-dev/*, allow

    # Explicitly deny sync on prod (belt-and-suspenders — policy.default is readonly)
    p, role:developer, applications, sync,     */petclinic-prod/*, deny

    # Read-only access to cluster and repo config (needed for app detail views)
    p, role:developer, clusters,     get, *, allow
    p, role:developer, repositories, get, *, allow
    p, role:developer, projects,     get, *, allow

    # View logs in dev
    p, role:developer, logs, get, */petclinic-dev/*, allow

    # -------------------------------------------------------------------------
    # Group → role bindings (update with your actual IdP group names)
    # -------------------------------------------------------------------------
    g, petclinic:ops,  role:admin
    g, petclinic:devs, role:developer

  # Use local accounts if no SSO is configured.
  # To add SSO (GitHub, Google, Okta), configure argocd-cm instead.
  # See: https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/