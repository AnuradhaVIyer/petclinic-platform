apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petclinic-dev

resources:
  - ../../base/namespaces.yaml
  - ../../base/config-server
  - ../../base/discovery-server
  - ../../base/customers-service
  - ../../base/visits-service
  - ../../base/vets-service
  - ../../base/genai-service
  - ../../base/api-gateway
  - ../../base/admin-server

# Image tags are updated by CI via helm-values/{service}.yaml (PETPLAT-50).
# For direct kubectl usage, set tags here:
images:
  - name: config-server
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/config-server
    newTag: latest  # replaced by CI with 7-char SHA
  - name: discovery-server
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/discovery-server
    newTag: latest
  - name: api-gateway
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/api-gateway
    newTag: latest
  - name: customers-service
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/customers-service
    newTag: latest
  - name: visits-service
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/visits-service
    newTag: latest
  - name: vets-service
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/vets-service
    newTag: latest
  - name: genai-service
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/genai-service
    newTag: latest
  - name: admin-server
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-dev/admin-server
    newTag: latest

patches:
  - path: replicas-patch.yaml