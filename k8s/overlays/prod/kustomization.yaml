apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petclinic-prod

resources:
  - ../../base/namespaces.yaml
  - ../../base/config-server
  - ../../base/discovery-server
  - ../../base/customers-service
  - ../../base/visits-service
  - ../../base/vets-service
  - ../../base/genai-service
  - ../../base/api-gateway
  - ../../base/admin-server
  - hpa.yaml
  - pdbs.yaml

images:
  - name: config-server
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/config-server
    newTag: latest  # replaced by CI with 7-char SHA
  - name: discovery-server
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/discovery-server
    newTag: latest
  - name: api-gateway
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/api-gateway
    newTag: latest
  - name: customers-service
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/customers-service
    newTag: latest
  - name: visits-service
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/visits-service
    newTag: latest
  - name: vets-service
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/vets-service
    newTag: latest
  - name: genai-service
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/genai-service
    newTag: latest
  - name: admin-server
    newName: <account-id>.dkr.ecr.eu-central-1.amazonaws.com/petclinic-prod/admin-server
    newTag: latest

patches:
  - path: replicas-patch.yaml
